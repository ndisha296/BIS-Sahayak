services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist the SQLite DB, Chroma vector store, and uploaded photos
      # outside the container so they survive rebuilds/restarts.
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/bis_assistant.db
      - CHROMA_PERSIST_DIR=/app/data/chroma_store
